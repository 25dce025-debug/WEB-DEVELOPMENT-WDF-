<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <div class="opaque-background-container">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            padding: 30px;
        }

        .container{
            width: 90%;
            margin: auto;
        }

        h1{
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h2{
            text-align: center;
            margin: 20px 0;
        }

        hr{
            border: none;
            border-top: 2px solid #999;
            margin: 15px 0;
        }

        .attendance-info{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            padding: 15px 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .attendance-info p{
            font-size: 20px;
            font-weight: bold;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 2px solid #f7f7f7;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        th{
            border: 1px solid #f9f8f8;
            padding: 15px;
            font-size: 20px;
            text-align: center;
        }

        td{
            border: 1px solid #fffdfd;
            padding: 12px;
            font-size: 18px;
            text-align: center;
        }

        tr:hover{
            background-color: #f2f2f2;
            transition: 0.3s;
        }

        .good{
            font-weight: bold;
        }

        .average{
            font-weight: bold;
        }

        .low{
            font-weight: bold;
        }

        footer{
            margin-top: 25px;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width:768px){

            body{
                padding:15px;
            }

            .attendance-info{
                flex-direction: column;
                gap:10px;
                text-align:center;
            }

            table{
                font-size:14px;
            }

            th,td{
                padding:10px;
            }
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Student Hub Portal</h1>

        <hr>

        <h2>Attendance</h2>

        <div class="attendance-info">
            <p>Lecture Gross Attendance : 80%</p>
            <p>Total Subjects : 5</p>
        </div>

        <table>

            <tr>
                <th>Subject Name</th>
                <th>Lectures Attended</th>
                <th>Attendance %</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>MSUD</td>
                <td>12 / 15</td>
                <td>80%</td>
                <td class="good">Good</td>
            </tr>

            <tr>
                <td>CEUC</td>
                <td>10 / 15</td>
                <td>66.67%</td>
                <td class="low">Low</td>
            </tr>

            <tr>
                <td>DSA</td>
                <td>14 / 15</td>
                <td>93.33%</td>
                <td class="good">Excellent</td>
            </tr>

            <tr>
                <td>WDF</td>
                <td>13 / 15</td>
                <td>86.67%</td>
                <td class="good">Good</td>
            </tr>

            <tr>
                <td>HSUV</td>
                <td>11 / 15</td>
                <td>73.33%</td>
                <td class="average">Average</td>
            </tr>

        </table>

        <footer>
            Student Hub Portal © 2026
        </footer>

    </div>
</div>
<style>
.opaque-background-container {
  position: relative; /* Establishes a reference for the background layer */
  width: 100%;
  min-height: 100vh; /* Ensures the container takes up the full viewport height */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  box-sizing: border-box;
  /* Optional: Set a fallback color underneath to ensure readability */
  background-color: #000000; 
}

/* Create the isolated background layer */
.opaque-background-container::before {
  content: ""; /* Required to render the pseudo-element */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0; /* Or use shorthand -> inset: 0; */
  
  /* Apply your background properties here */
  background-image: url('D:\\studenthub\\images\\1653903314142198723_3418152504953493_7608013727901633946_n.webp');
  background-size: cover;
  background-position:center;
  background-repeat: no-repeat;
  background-attachment: fixed; /* Optional: Makes the background stay in place during scroll */
  
  /* Adjust transparency (Value between 0.0 and 1.0) */
  opacity: 0.4; 
  
  /* Places the image layer behind the text content */
  z-index: 1; 
}

/* Ensure the text content renders cleanly over the background */
.opaque-background-container * {
  position: relative;
  z-index: 2; /* Must be a higher value than the pseudo-element z-index */
  color: #ffffff; /* Contrast text color */
}
</style>

</body>
</html>
